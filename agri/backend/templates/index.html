<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-green-200 to-green-500 p-10">
    <div class="container mx-auto max-w-lg bg-white rounded-lg shadow-lg p-8">
        <h3 class="text-center text-4xl font-bold text-green-700 mb-6">🌾 Crop Recommendation System</h3>
        <form action="/predict" method="post">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">N (Nitrogen)</label>
                <input name="N" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">P (Phosphorus)</label>
                <input name="P" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">K (Potassium)</label>
                <input name="K" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">Temperature (°C)</label>
                <input name="temperature" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">Humidity (%)</label>
                <input name="humidity" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">Soil pH</label>
                <input name="ph" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">Rainfall (mm)</label>
                <input name="rainfall" type="number" step="any" required class="border border-gray-300 rounded-lg w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition duration-200">Predict</button>
        </form>
        <br>
        <h5 class="text-center text-lg text-gray-700">{{ prediction_text }}</h5>
    </div>
</body>
</html>
